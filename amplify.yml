
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g bun
        - bun install
    build:
      commands:
        - bun run build
        - echo "=== DIST CONTENTS ==="
        - ls -la dist
        - echo "=== ASSET CONTENTS ==="
        - ls -la dist/assets
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

